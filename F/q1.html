<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quantity Counter</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 50px;
      }

      .card {
        width: 300px;
        margin: auto;
        background: white;
        padding: 25px;
        text-align: center;
        border-radius: 10px;
      }

      button {
        padding: 10px 18px;
        font-size: 18px;
        cursor: pointer;
      }

      #quantity {
        font-size: 24px;
        margin: 20px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <button id="decrease">−</button>

      <span id="quantity">1</span>

      <button id="increase">+</button>
    </div>

    <script>
      const qty = document.getElementById("quantity");
      const inc = document.getElementById("increase");
      const dec = document.getElementById("decrease");
      let cnt = Number(qty.textContent);
      const render = () => {
        qty.textContent = cnt;
      };
      inc.addEventListener("click", () => {
        if (cnt < 10) cnt++;
        render();
      });
      dec.addEventListener("click", () => {
        if (cnt > 1) cnt--;
        render();
      });
      render();
    </script>
  </body>
</html>
