<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Email Validation</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 50px;
        background: #f4f4f4;
      }

      .card {
        width: 400px;
        margin: auto;
        padding: 25px;
        background: white;
        border-radius: 10px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
      }

      #message {
        margin-top: 12px;
      }

      .valid {
        color: green;
      }

      .invalid {
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <input id="email" placeholder="Enter email" />

      <p id="message">Enter a valid email.</p>
    </div>

    <script>
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const mail = document.getElementById("email");
      const msg = document.getElementById("message");
      mail.addEventListener("input", () => {
        msg.classList.remove("valid", "invalid");
        const text = mail.value;
        if (text === "") {
          msg.textContent = `Enter a valid email.`;
          msg.classList.add("invalid");
        } else if (emailRegex.test(text)) {
          msg.textContent = `Email is valid`;
          msg.classList.add("valid");
        } else {
          msg.textContent = "Invalid";
          msg.classList.add("invalid");
        }
      });
    </script>
  </body>
</html>
