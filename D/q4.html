<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Confirmation</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 50px;
      }

      .card {
        width: 400px;
        margin: auto;
        padding: 25px;
        background: white;
        border-radius: 10px;
      }

      input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-bottom: 10px;
      }

      button {
        padding: 10px 15px;
      }

      #message {
        margin-top: 12px;
      }

      .valid {
        color: green;
      }

      .invalid {
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <input id="password" type="password" placeholder="Password" />
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm password"
      />

      <button id="submitBtn" disabled>Create Account</button>

      <p id="message">Enter both passwords.</p>
    </div>

    <script>
      const pass = document.getElementById("password");
      const cpass = document.getElementById("confirmPassword");
      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("message");
      cpass.addEventListener("input", () => {
        msg.classList.remove("valid", "invalid");
        if (pass.value.trim() === cpass.value.trim()) {
          btn.disabled = false;
          msg.classList.add("valid");
          msg.textContent = `Valid Password.`;
        } else {
          btn.disabled = true;
          msg.classList.add("invalid");
          msg.textContent = `InValid Password.`;
        }
      });
    </script>
  </body>
</html>
