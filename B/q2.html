<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Rendering</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 50px;
        background: #f2f2f2;
      }

      .card {
        background: white;
        width: 400px;
        margin: auto;
        padding: 25px;
        border-radius: 10px;
      }

      #message {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ddd;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <button id="showBtn">Show Message</button>

      <div id="message">Nothing yet.</div>
    </div>

    <script>
      const button = document.getElementById("showBtn");
      const text = document.getElementById("message");
      button.addEventListener("click", () => {
        text.innerHTML = "<strong>Success !</strong>";
      });
    </script>
  </body>
</html>
