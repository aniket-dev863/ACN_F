<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Employee Search</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 40px;
      }

      .card {
        width: 450px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-bottom: 15px;
      }

      .employee {
        padding: 10px;
        margin-top: 6px;
        background: #eee;
        border-radius: 5px;
      }

      #count {
        font-weight: bold;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <input id="search" placeholder="Search employees..." />

      <p id="count"></p>

      <div id="employeeList"></div>
    </div>

    <script>
      const employees = ["Aniket", "Rahul", "Priya", "Amit", "Sneha", "Rohan"];
      const input = document.getElementById("search");
      const list = document.getElementById("employeeList");
      const count = document.getElementById("count");
      input.addEventListener("input", () => {
        list.innerHTML = "";
        const text = input.value.trim().toLowerCase();
        if (text === "") count.textContent = "Please enter the Text ";
        employees.forEach((e) => {
          if (e.toLowerCase().includes(text)) {
            const div = document.createElement("div");
            div.classList.add("employee");
            div.textContent = e;
            list.append(div);
          }
        });
      });
    </script>
  </body>
</html>
