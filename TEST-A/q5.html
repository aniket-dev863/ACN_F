<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Task Manager</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 40px;
      }

      .container {
        width: 450px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
      }

      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      input {
        flex: 1;
        padding: 10px;
      }

      button {
        padding: 8px 12px;
        cursor: pointer;
      }

      .task {
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
      }

      .task.selected {
        background: #222;
        color: white;
      }

      #status {
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="input-row">
        <input id="taskInput" placeholder="Enter task" />
        <button id="addTask">Add</button>
      </div>

      <div id="taskList"></div>

      <p id="status">No task selected.</p>
    </div>

    <script>
      // TODO: your JS here
    </script>
  </body>
</html>
