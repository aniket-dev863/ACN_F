<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Product Wishlist</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 40px;
      }

      .container {
        width: 600px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      input,
      select {
        padding: 10px;
      }

      input {
        flex: 1;
      }

      .product {
        padding: 15px;
        margin-bottom: 10px;
        background: #eee;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .product-info {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      button {
        padding: 8px 12px;
        cursor: pointer;
      }

      .wishlisted {
        background: #222;
        color: white;
      }

      #wishlistCount {
        font-weight: bold;
        margin-bottom: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="controls">
        <input id="search" type="text" placeholder="Search products..." />

        <select id="category">
          <option value="all">All</option>
          <option value="electronics">Electronics</option>
          <option value="books">Books</option>
          <option value="clothing">Clothing</option>
        </select>
      </div>

      <div id="wishlistCount">Wishlist: 0</div>

      <div id="productList"></div>
    </div>

    <script>
      const products = [
        {
          id: 1,
          name: "Wireless Mouse",
          category: "electronics",
          price: 700,
          wishlisted: false,
        },
        {
          id: 2,
          name: "Mechanical Keyboard",
          category: "electronics",
          price: 1800,
          wishlisted: false,
        },
        {
          id: 3,
          name: "JavaScript Book",
          category: "books",
          price: 900,
          wishlisted: false,
        },
        {
          id: 4,
          name: "CSS Handbook",
          category: "books",
          price: 1200,
          wishlisted: false,
        },
        {
          id: 5,
          name: "Black T-Shirt",
          category: "clothing",
          price: 600,
          wishlisted: false,
        },
        {
          id: 6,
          name: "Denim Jacket",
          category: "clothing",
          price: 2200,
          wishlisted: false,
        },
      ];
      const search = document.getElementById("search");
      const category = document.getElementById("category");
      const productList = document.getElementById("productList");
      const wishlistCount = document.getElementById("wishlistCount");
      const filter = (query, cat) => {
        return products.filter((p) => {
          const sameCat = cat === "all" || p.category === cat;
          const sameName = p.name.toLowerCase().includes(query);

          return sameCat && sameName;
        });
      };
      function renderProducts() {
        productList.innerHTML = ""; // clear list ;
        const query = search.value.trim().toLowerCase();
        const selectedCategory = category.value;
        const filteredProdList = filter(query, selectedCategory);
        filteredProdList.forEach((p) => {
          const div = document.createElement("div");
          div.classList.add("product");
          const info = document.createElement("div");
          info.classList.add("product-info");
          const price = document.createElement("span");
          price.textContent = `₹${p.price}`;
          const name = document.createElement("span");
          name.textContent = p.name;
          info.append(name, price);
          const button = document.createElement("button");
          button.textContent = p.wishlisted ? "Added ✓" : "Add to Wishlist";
          button.classList.toggle("wishlisted", p.wishlisted);
          button.addEventListener("click", () => {
            p.wishlisted = !p.wishlisted;
            renderProducts();
          });
          div.append(info, button);
          productList.append(div);
        });
        const count = products.filter((p) => {
          return p.wishlisted === true;
        }).length;
        wishlistCount.textContent = `Wishlist: ${count}`;
      }
      search.addEventListener("input", renderProducts);
      category.addEventListener("change", renderProducts);
      renderProducts();
    </script>
  </body>
</html>
